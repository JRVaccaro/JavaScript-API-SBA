<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript API SBA</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="scripts/script.js"></script>

</head>
<body>


<div class="container"></div>

<input type="text" id="searchInput" placeholder="searching...">

<button id="searchButton">Search</button>

<div id="results"></div>

<h2>Make a post!</h2>

<input type ="text" id="postTitle" placeholder="Post Title">
<input type="text" id="postBody" placeholder="Post Content">

<button id="createButton">Make Post</button>


<h2>Update ya post!</h2>

<input type="text" id="updateId" placeholder="Post ID">
<input type="text" id="updateTitle" placeholder="New Title">

<button id="updateButton">Update Post</button>


</body>
</html>
